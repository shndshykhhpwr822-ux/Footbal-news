<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فوتبال نیوز | لیگ قه‌لا</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:
      radial-gradient(circle at top,#102c45 0,#05080d 42%,#020305 100%);
    color:#fff;
}
header{
    padding:30px 15px;
    text-align:center;
    border-bottom:1px solid #d6a83b55;
    background:linear-gradient(135deg,#050505,#111923);
}
.logo{
    width:75px;height:75px;
    margin:auto;
    border:3px solid #d9aa3d;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:bold;
    color:#d9aa3d;
    box-shadow:0 0 25px #d9aa3d55;
}
h1{
    margin:12px 0 5px;
    font-size:30px;
}
.subtitle{
    color:#8fdcff;
    font-size:14px;
}
nav{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    padding:15px;
    background:#060a0f;
}
nav button{
    border:1px solid #d9aa3d66;
    background:#101821;
    color:#fff;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
}
nav button:hover{
    background:#d9aa3d;
    color:#000;
}
.container{
    width:min(1100px,94%);
    margin:25px auto;
}
.card{
    background:linear-gradient(145deg,#101821,#070b10);
    border:1px solid #ffffff12;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 35px #0008;
}
.title{
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
}
.live{
    color:#ff4242;
    animation:pulse 1.2s infinite;
}
@keyframes pulse{
    50%{opacity:.45}
}
table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
}
th{
    background:#d9aa3d;
    color:#080808;
    padding:12px 6px;
}
td{
    padding:12px 5px;
    text-align:center;
    border-bottom:1px solid #ffffff0d;
}
tr:hover{background:#ffffff08}
.team{
    text-align:right;
    font-weight:bold;
}
.rank{
    font-size:19px;
    font-weight:bold;
}

.silver{color:#ddd}
